<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROBOTWORLD — Workbench</title>
  <link rel="icon" type="image/png" href="../favicon.png" />
</head>
<body>
  <!-- The workbenches are their own page: /workbench/?edit=<tool>&mech=<id>.
       Same canvas + overlay ids the game uses, so a tool can host the real
       engine (the animation workbench runs actual fighters) without caring
       which page it was opened from. -->
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
